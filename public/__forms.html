<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <!--
      This file exists only so Netlify's build-time form detection registers
      the "inquiry" form. It is never shown to visitors — the real form is the
      React component at /contact, which POSTs here.
      Every field the React form submits must be listed below.
    -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="tel" name="phone" />
      <input type="text" name="industry" />
      <input type="text" name="package" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
